{{- if and .Values.ingressTcp.enabled .Values.service.docker.enabled }}
apiVersion: {{ .Values.ingressTcp.apiVersion | default "traefik.io/v1alpha1" }}
kind: IngressRouteTCP
metadata:
  name: {{ include "nexus.fullname" . }}-docker
  labels:
    {{- include "nexus.labels" . | nindent 4 }}
    {{- with .Values.ingressTcp.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.ingressTcp.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  entryPoints:
    {{- range .Values.ingressTcp.entryPoints }}
    - {{ . }}
    {{- end }}
  routes:
    - match: HostSNI(`{{ .Values.ingressTcp.hostSNI | default "*" }}`)
      services:
        - name: {{ include "nexus.fullname" . }}
          port: {{ .Values.service.docker.port }}
  {{- if .Values.ingressTcp.tls.enabled }}
  tls:
    {{- if .Values.ingressTcp.tls.passthrough }}
    passthrough: true
    {{- end }}
    {{- with .Values.ingressTcp.tls.secretName }}
    secretName: {{ . }}
    {{- end }}
  {{- end }}
{{- end }}
